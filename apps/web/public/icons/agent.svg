<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Outer glowing background aura -->
  <circle cx="64" cy="64" r="48" fill="url(#agent-glow)" opacity="0.15" />
  
  <!-- Outer dashed ring -->
  <circle cx="64" cy="64" r="40" stroke="white" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 6" />

  <!-- Center Core -->
  <rect x="52" y="52" width="24" height="24" rx="6" fill="#0c0c0c" stroke="url(#accent-grad)" stroke-width="2.5" />
  <circle cx="64" cy="64" r="4" fill="white" />

  <!-- Connections / Nodes -->
  <!-- Top Node -->
  <line x1="64" y1="52" x2="64" y2="34" stroke="white" stroke-width="1.5" stroke-opacity="0.6" />
  <circle cx="64" cy="34" r="4" fill="#0c0c0c" stroke="white" stroke-width="2" />
  
  <!-- Bottom Node -->
  <line x1="64" y1="76" x2="64" y2="94" stroke="white" stroke-width="1.5" stroke-opacity="0.6" />
  <circle cx="64" cy="94" r="4" fill="#0c0c0c" stroke="white" stroke-width="2" />

  <!-- Left Node -->
  <line x1="52" y1="64" x2="34" y2="64" stroke="white" stroke-width="1.5" stroke-opacity="0.6" />
  <circle cx="34" cy="64" r="4" fill="#0c0c0c" stroke="white" stroke-width="2" />

  <!-- Right Node -->
  <line x1="76" y1="64" x2="94" y2="64" stroke="white" stroke-width="1.5" stroke-opacity="0.6" />
  <circle cx="94" cy="64" r="4" fill="#0c0c0c" stroke="white" stroke-width="2" />

  <!-- Diagonals -->
  <line x1="55" y1="55" x2="42" y2="42" stroke="white" stroke-width="1.5" stroke-opacity="0.4" />
  <line x1="73" y1="55" x2="86" y2="42" stroke="white" stroke-width="1.5" stroke-opacity="0.4" />
  <line x1="55" y1="73" x2="42" y2="86" stroke="white" stroke-width="1.5" stroke-opacity="0.4" />
  <line x1="73" y1="73" x2="86" y2="86" stroke="white" stroke-width="1.5" stroke-opacity="0.4" />

  <defs>
    <radialGradient id="agent-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent-grad" x1="52" y1="52" x2="76" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#333333" />
    </linearGradient>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Outer glowing background aura -->
  <circle cx="64" cy="64" r="48" fill="url(#db-glow)" opacity="0.15" />
  
  <!-- Outer dashed ring -->
  <circle cx="64" cy="64" r="40" stroke="white" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 6" />

  <!-- Database Stack -->
  <g transform="translate(42, 38)">
    <!-- Cylinder 1 (Top) -->
    <path d="M0 8 A22 6 0 0 0 44 8 A22 6 0 0 0 0 8 Z" fill="#0c0c0c" stroke="url(#accent-grad)" stroke-width="2.5" />
    
    <!-- Cylinder 2 (Middle) -->
    <path d="M0 8 V22 A22 6 0 0 0 44 22 V8" fill="#0c0c0c" stroke="url(#accent-grad)" stroke-width="2.5" />
    <path d="M0 22 A22 6 0 0 0 44 22" stroke="white" stroke-width="1" stroke-opacity="0.3" />

    <!-- Cylinder 3 (Bottom) -->
    <path d="M0 22 V36 A22 6 0 0 0 44 36 V22" fill="#0c0c0c" stroke="url(#accent-grad)" stroke-width="2.5" />
    <path d="M0 36 A22 6 0 0 0 44 36" stroke="white" stroke-width="1" stroke-opacity="0.3" />

    <!-- Glowing points/Lines on front -->
    <line x1="22" y1="14" x2="22" y2="30" stroke="white" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="2 2" />
    <circle cx="22" cy="14" r="2" fill="white" />
    <circle cx="22" cy="28" r="2" fill="white" />
  </g>

  <defs>
    <radialGradient id="db-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="44" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#333333" />
    </linearGradient>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Outer glowing background aura -->
  <circle cx="64" cy="64" r="48" fill="url(#lock-glow)" opacity="0.15" />
  
  <!-- Outer dashed ring -->
  <circle cx="64" cy="64" r="40" stroke="white" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 6" />
  
  <!-- Inner lock design -->
  <g transform="translate(44, 40)">
    <!-- Shackle -->
    <path d="M12 24 V16 A8 8 0 0 1 28 16 V24" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.8" />
    <!-- Lock Body -->
    <rect x="4" y="24" width="32" height="24" rx="6" fill="#0c0c0c" stroke="url(#accent-grad)" stroke-width="2.5" />
    <!-- Keyhole -->
    <circle cx="20" cy="33" r="3" fill="white" />
    <path d="M20 36 L20 41" stroke="white" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Decorative radar lines -->
  <path d="M64 8 L64 16" stroke="white" stroke-width="1.5" stroke-opacity="0.4" />
  <path d="M64 112 L64 120" stroke="white" stroke-width="1.5" stroke-opacity="0.4" />
  <path d="M8 64 L16 64" stroke="white" stroke-width="1.5" stroke-opacity="0.4" />
  <path d="M112 64 L120 64" stroke="white" stroke-width="1.5" stroke-opacity="0.4" />

  <defs>
    <radialGradient id="lock-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent-grad" x1="0" y1="24" x2="40" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#333333" />
    </linearGradient>
  </defs>
</svg>
